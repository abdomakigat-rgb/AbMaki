<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="معرض صور اخر يوم امتحانات دفعه 2026">
    <meta property="og:description" content="استمتع بتصفح اللحظات الجميلة">
    <meta property="og:image" content="https://i.ibb.co/jk7DHL2j/Picsart-26-06-06-15-33-16-196.png">
    <meta property="og:type" content="website">

    <title>معرض صور اخر يوم امتحانات دفعه 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0b0f19 0%, #1a2a44 100%);
            color: #f1f5f9;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            min-height: 100vh;
        }

        header {
            background: #ffffff;
            color: #0b0f19;
            padding: 40px 20px;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }
        .logo:hover { transform: scale(1.05); }

        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
            color: #0b0f19;
        }
        
        p { color: #475569; font-weight: 600; font-size: 1.1rem; }

        .appreciation-box {
            background: #fff;
            color: #333;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            border-radius: 20px;
        }

        .gallery-section {
            max-width: 1100px;
            margin: 40px auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        iframe {
            width: 100%;
            height: 650px;
            border-radius: 20px;
            border: none;
        }

        footer {
            padding: 30px;
            color: #fff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://i.ibb.co/jk7DHL2j/Picsart-26-06-06-15-33-16-196.png" alt="Logo" class="logo">
        <h1>معرض صور اخر يوم امتحانات دفعه 2026</h1>
        <p>استمتع بتصفح اللحظات الجميلة</p>
    </header>

    <div class="appreciation-box">
        <img src="https://i.ibb.co/jk7DHL2j/Picsart-26-06-06-15-33-16-196.png" style="width: 80px; border-radius: 50%;">
        <h3>رسالة شكر وتقدير</h3>
        <p>نتقدم بخالص الشكر والتقدير إلى مديرنا الفاضل الشيخ علاء رزق، وإلى جميع معلمينا الأجلاء على جهودهم العظيمة طوال العام الدراسي. كنتم لنا خير قدوة وموجه، فلكم منا كل الحب والامتنان.</p>
    </div>

    <div class="gallery-section">
        <iframe src="https://drive.google.com/embeddedfolderview?id=1lWCUw9BC4quyrFB6UuDJmPBjathKjsQK#grid" 
                allowfullscreen>
        </iframe>
    </div>

    <footer>
        <img src="https://i.ibb.co/jk7DHL2j/Picsart-26-06-06-15-33-16-196.png" style="width: 100px; border-radius: 15px; margin-bottom: 10px;">
        <p>جميع الحقوق محفوظة © دفعة 2026</p>
    </footer>

</body>
</html>
