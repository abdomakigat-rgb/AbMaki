<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض صور Ab Maki</title>
    <style>
        /* الأساسيات وإعادة التعيين */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            padding-bottom: 60px;
        }

        /* هيدر احترافي */
        header {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            text-align: center;
            padding: 50px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.85;
        }

        /* شبكة عرض الصور المستجيبة (Grid) */
        .gallery-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* كارت الصورة */
        .photo-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* إطار الصور الطولية (Vertical) */
        .image-wrapper {
            width: 100%;
            height: 420px;
            overflow: hidden;
            background-color: #cbd5e1;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-card:hover .image-wrapper img {
            transform: scale(1.04);
        }

        /* منطقة زر التحميل */
        .card-body {
            padding: 20px;
            text-align: center;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .download-btn:hover {
            background-color: #1d4ed8;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        /* الفوتر */
        footer {
            text-align: center;
            margin-top: 60px;
            color: #64748b;
            font-size: 1rem;
            font-weight: 500;
        }
    </style>
</head>
